<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Aubit AI System Architecture Diagram</title>
  <desc id="desc">Architecture diagram showing the Aubit AI desktop companion with user, Electron shell, frontend modules, backend API, service layer, storage, external integrations, and future expansion areas.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2a44" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b5876"/>
    </marker>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #162235; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #52657a; }
      .section-title { font: 800 18px Arial, sans-serif; fill: #162235; }
      .box-title { font: 800 16px Arial, sans-serif; fill: #162235; }
      .box-text { font: 500 13px Arial, sans-serif; fill: #465a70; }
      .small-text { font: 600 12px Arial, sans-serif; fill: #52657a; }
      .panel { fill: #ffffff; stroke: #d8e2ec; stroke-width: 2; filter: url(#shadow); }
      .user { fill: #eaf6ff; stroke: #7bb8df; }
      .desktop { fill: #fff5e8; stroke: #e0ad65; }
      .frontend { fill: #edf8f1; stroke: #73bd86; }
      .backend { fill: #f3efff; stroke: #9b82dc; }
      .storage { fill: #fff0f2; stroke: #df7f8f; }
      .future { fill: #eef2f7; stroke: #9aa9ba; stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #3b5876; stroke-width: 3; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #7c91a7; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#pageBg)"/>

  <text x="700" y="54" text-anchor="middle" class="title">Aubit AI System Architecture</text>
  <text x="700" y="84" text-anchor="middle" class="subtitle">Interactive desktop companion with frontend UI, Electron shell, backend API, service layer, games, study tools, and future AI integrations</text>

  <rect x="44" y="132" width="190" height="150" rx="18" class="panel user"/>
  <text x="139" y="170" text-anchor="middle" class="section-title">User</text>
  <text x="139" y="204" text-anchor="middle" class="box-text">Login / Guest Mode</text>
  <text x="139" y="229" text-anchor="middle" class="box-text">Pod Interaction</text>
  <text x="139" y="254" text-anchor="middle" class="box-text">Assistant + Tools</text>

  <rect x="298" y="112" width="244" height="190" rx="20" class="panel desktop"/>
  <text x="420" y="150" text-anchor="middle" class="section-title">Electron Desktop Shell</text>
  <text x="420" y="184" text-anchor="middle" class="box-text">Desktop window</text>
  <text x="420" y="209" text-anchor="middle" class="box-text">Preload bridge</text>
  <text x="420" y="234" text-anchor="middle" class="box-text">Backend startup scripts</text>
  <text x="420" y="259" text-anchor="middle" class="box-text">Desktop widget support</text>

  <rect x="608" y="112" width="350" height="280" rx="22" class="panel frontend"/>
  <text x="783" y="150" text-anchor="middle" class="section-title">Frontend Application</text>
  <text x="783" y="179" text-anchor="middle" class="small-text">HTML, CSS, JavaScript</text>

  <rect x="638" y="205" width="135" height="58" rx="12" fill="#ffffff" stroke="#b9d9c2"/>
  <text x="705.5" y="229" text-anchor="middle" class="box-title">Entry Flow</text>
  <text x="705.5" y="249" text-anchor="middle" class="box-text">Login + Pod</text>

  <rect x="793" y="205" width="135" height="58" rx="12" fill="#ffffff" stroke="#b9d9c2"/>
  <text x="860.5" y="229" text-anchor="middle" class="box-title">Assistant UI</text>
  <text x="860.5" y="249" text-anchor="middle" class="box-text">Chat + Actions</text>

  <rect x="638" y="285" width="135" height="58" rx="12" fill="#ffffff" stroke="#b9d9c2"/>
  <text x="705.5" y="309" text-anchor="middle" class="box-title">Game Hub</text>
  <text x="705.5" y="329" text-anchor="middle" class="box-text">Chess, Sudoku...</text>

  <rect x="793" y="285" width="135" height="58" rx="12" fill="#ffffff" stroke="#b9d9c2"/>
  <text x="860.5" y="309" text-anchor="middle" class="box-title">Study Tools</text>
  <text x="860.5" y="329" text-anchor="middle" class="box-text">Learning support</text>

  <rect x="668" y="357" width="230" height="50" rx="12" fill="#ffffff" stroke="#b9d9c2"/>
  <text x="783" y="387" text-anchor="middle" class="box-title">Customization + Themes</text>

  <rect x="1026" y="112" width="320" height="280" rx="22" class="panel backend"/>
  <text x="1186" y="150" text-anchor="middle" class="section-title">FastAPI Backend</text>
  <text x="1186" y="179" text-anchor="middle" class="small-text">API routes, validation, business logic</text>

  <rect x="1056" y="205" width="120" height="58" rx="12" fill="#ffffff" stroke="#cbbcf2"/>
  <text x="1116" y="229" text-anchor="middle" class="box-title">Auth Routes</text>
  <text x="1116" y="249" text-anchor="middle" class="box-text">Users / guest</text>

  <rect x="1196" y="205" width="120" height="58" rx="12" fill="#ffffff" stroke="#cbbcf2"/>
  <text x="1256" y="229" text-anchor="middle" class="box-title">AI Routes</text>
  <text x="1256" y="249" text-anchor="middle" class="box-text">Assistant API</text>

  <rect x="1056" y="285" width="120" height="58" rx="12" fill="#ffffff" stroke="#cbbcf2"/>
  <text x="1116" y="309" text-anchor="middle" class="box-title">Game API</text>
  <text x="1116" y="329" text-anchor="middle" class="box-text">Scores / state</text>

  <rect x="1196" y="285" width="120" height="58" rx="12" fill="#ffffff" stroke="#cbbcf2"/>
  <text x="1256" y="309" text-anchor="middle" class="box-title">Services</text>
  <text x="1256" y="329" text-anchor="middle" class="box-text">AI + storage</text>

  <rect x="346" y="506" width="260" height="205" rx="22" class="panel storage"/>
  <text x="476" y="545" text-anchor="middle" class="section-title">Storage Layer</text>
  <text x="476" y="579" text-anchor="middle" class="box-text">Current local/fallback storage</text>
  <text x="476" y="606" text-anchor="middle" class="box-text">User preferences</text>
  <text x="476" y="633" text-anchor="middle" class="box-text">Game progress</text>
  <text x="476" y="660" text-anchor="middle" class="box-text">Future persistent memory</text>

  <rect x="668" y="506" width="260" height="205" rx="22" class="panel future"/>
  <text x="798" y="545" text-anchor="middle" class="section-title">External Integrations</text>
  <text x="798" y="579" text-anchor="middle" class="box-text">AI model APIs</text>
  <text x="798" y="606" text-anchor="middle" class="box-text">Speech-to-text</text>
  <text x="798" y="633" text-anchor="middle" class="box-text">Text-to-speech</text>
  <text x="798" y="660" text-anchor="middle" class="box-text">Cloud sync services</text>

  <rect x="990" y="506" width="260" height="205" rx="22" class="panel future"/>
  <text x="1120" y="545" text-anchor="middle" class="section-title">Future Expansion</text>
  <text x="1120" y="579" text-anchor="middle" class="box-text">SQLite / MongoDB</text>
  <text x="1120" y="606" text-anchor="middle" class="box-text">3D Aubit character</text>
  <text x="1120" y="633" text-anchor="middle" class="box-text">Inventory + rewards</text>
  <text x="1120" y="660" text-anchor="middle" class="box-text">Mobile companion app</text>

  <path class="line" d="M234 207 H298"/>
  <path class="line" d="M542 207 H608"/>
  <path class="line" d="M958 252 H1026"/>
  <path class="soft-line" d="M1186 392 C1186 455 1040 450 928 525"/>
  <path class="soft-line" d="M1116 392 C1048 464 657 455 560 525"/>
  <path class="soft-line" d="M1186 392 C1220 453 1210 466 1158 506"/>
  <path class="soft-line" d="M476 506 C492 448 646 428 705 407"/>
  <path class="soft-line" d="M798 506 C822 459 875 430 860 407"/>

  <rect x="92" y="770" width="1216" height="74" rx="18" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/>
  <text x="700" y="802" text-anchor="middle" class="box-title">Core Flow</text>
  <text x="700" y="829" text-anchor="middle" class="box-text">User interacts with Aubit through the Electron desktop shell. The frontend manages the visual companion experience, while FastAPI handles backend routes, services, storage, and future AI/cloud integrations.</text>
</svg>
